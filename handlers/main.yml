---
# file: haproxy/handlers/main.yml
#
# handlers file
#

- name: start haproxy
  service:
    name=haproxy
    state=started
  become: true

- name: stop haproxy
  service:
    name=haproxy
    state=stopped
  become: true

- name: reload haproxy
  service:
    name=haproxy
    state=reloaded
  become: true

- name: restart haproxy
  service:
    name=haproxy
    state=restarted
  become: true
